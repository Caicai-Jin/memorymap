name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Real Postgres + Redis, matching how the app actually runs locally (the project
    # deliberately chose testing against real Postgres over an in-memory H2 database).
    # These only exist for the lifetime of this CI run, thrown away afterward.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: memorymap
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw isn't tracked as executable in git (this repo was developed on Windows,
      # which doesn't have a Unix executable bit), so Linux runners need this explicitly.
      - name: Make mvnw executable
        run: chmod +x mvnw

      # DB_PASSWORD just needs to match the throwaway Postgres container above —
      # it's not a real secret, so it's fine directly in this file. JWT_SECRET/
      # Cloudinary keys are deliberately NOT needed here: the "test" Spring profile
      # (src/test/resources/application-test.properties) already provides dummy
      # values for those, so tests never depend on any real project secrets.
      - name: Run tests
        env:
          DB_PASSWORD: ci_only_password
        run: ./mvnw test
