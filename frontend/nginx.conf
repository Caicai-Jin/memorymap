server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side (e.g. /moments, /login) — without this,
    # nginx would 404 on a direct visit or refresh to any route other than "/", since
    # there's no actual moments.html file on disk. Falling back to index.html lets
    # React Router take over and render the right page itself.
    location / {
        try_files $uri /index.html;
    }
}
