services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: memorymap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # No host port mapping on purpose — the backend reaches this over Docker's
    # internal network by service name ("postgres"), and this avoids clashing with
    # a Postgres already running directly on the host machine's own port 5432.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    # Same reasoning as postgres above — internal-only, no host port mapping.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Overrides application.properties' localhost defaults — inside Docker's network,
      # "localhost" from the backend container's own perspective would mean itself,
      # not the postgres/redis containers, so these point at the service names instead.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memorymap
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
