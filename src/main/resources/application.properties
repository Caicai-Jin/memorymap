spring.application.name=memorymap

spring.datasource.url=jdbc:postgresql://localhost:5432/memorymap
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Default is 1MB/10MB, well under the app's own 50MB-per-file media limit —
# without this, any upload over 1MB was silently rejected before ever reaching MediaService.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# Spring Boot hides exception messages from error responses by default (security default).
# Safe to enable here: every custom exception in this app throws a short, deliberately
# client-safe message (e.g. "Email already in use") — none leak internals or stack traces.
server.error.include-message=always