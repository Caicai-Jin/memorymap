# Overrides on top of src/main/resources/application.properties for the "test" profile.
# jwt.secret/cloudinary.* don't need to be real here: tests only verify tokens they
# generated themselves in the same JVM run, and none of the current tests call Cloudinary
# for real (MediaLimitTest's 9-item check rejects before any Cloudinary call happens).
# Keeps tests independent of the developer's real env vars/secrets, and CI-ready later.
jwt.secret=VbpI4iLjN3CfpY78PokOoGk7Byo/CXQ5/ozBfFUbT1A=
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Email verification is disabled for tests — none of the existing e2e tests can retrieve
# a real token from a real inbox, so gating login on it here would break every test that
# registers then logs in. UserService checks this flag before requiring verification at all.
app.email-verification.enabled=false
app.mail.from=test@example.com
app.frontend-url=http://localhost:5173
app.brevo.api-key=test
